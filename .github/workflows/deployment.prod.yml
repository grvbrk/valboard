name: PROD Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_PROD }}
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
      SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}
      REGION: ${{ vars.REGION_PROD }}
      ARTIFACT_REPO_NAME: ${{ vars.ARTIFACT_REPO_NAME_PROD }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME_PROD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Docker Auth to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./python-scraper
          file: ./python-scraper/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO_NAME }}/prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO_NAME }}/prod:${{ github.sha }}
          flags: |
            --port=8080
            --allow-unauthenticated
            --execution-environment=gen2
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --timeout=300s
            --service-account=${{ env.SERVICE_ACCOUNT }}

      - name: Show Cloud Run URL
        run: echo "Deployed successfully to ${{ steps.deploy.outputs.url }}"
